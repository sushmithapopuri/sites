<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Create color palette with Javascript" />
    <meta
      name="keywords"
      content="JavaScript, Color spaces, CSS, Color palette, Color quantization"
    />
    <meta name="author" content="Sushmitha Popuri" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Matcher </title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/matcher.css" />

    <script src="js/main.js"></script>
    <script src="js/matcher.js"></script>
  </head>

  <body>
    
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Color Matcher</h5>
        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
        <input type="file" class="form-control-md btn-outline-secondary btn-rounded" id="imgfile" />
        <button id="imgload" type="button" class="btn btn-lg btn-secondary btn-rounded" data-mdb-ripple-init onclick="extract();">Load</button>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="palette"></div>
    <hr />
    <div id="complementary"></div>

    <div class="input-group mb-3">
      <span class="input-group-text btn-secondary">Reference Color</span>
      <input id = "refColor"
        type="text"
        class="form-control"
        aria-label="Amount (to the nearest dollar)"
      />
    </div>

    <div class="camera-controls card">
      <div class="card-body">
        <h5 class="card-title">Live camera palette</h5>
        <p class="card-text">Open your camera, preview live video, and extract the dominant colors as a palette.</p>
        <div class="btn-group" role="group">
          <button id="startCamera" type="button" class="btn btn-lg btn-secondary btn-rounded" onclick="openCamera();">Open Camera</button>
          <button id="capturePalette" type="button" class="btn btn-lg btn-secondary btn-rounded" onclick="capturePalette();" disabled>Capture Palette</button>
          <button id="stopCamera" type="button" class="btn btn-lg btn-secondary btn-rounded" onclick="stopCamera();" disabled>Stop Camera</button>
        </div>
        <div id="cameraStatus" class="mt-3">Camera is not active.</div>
      </div>
    </div>

    <div class="video-preview">
      <h2>Preview</h2>
      <video id="preview" width="320" height="240" autoplay muted playsinline></video>
      <canvas id="videoFrame" width="320" height="240" style="display:none"></canvas>
    </div>

</body>
</html>
